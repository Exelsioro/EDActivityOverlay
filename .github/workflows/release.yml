name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"
  NUGET_XMLDOC_MODE: skip

jobs:
  release:
    name: Build and publish release
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve release version
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'
          if (-not $tag.StartsWith('v')) {
            throw "Release tag must start with v: $tag"
          }

          $version = $tag.Substring(1)
          if ($version -notmatch '^(\d+)\.(\d+)\.(\d+)(?:[-+][0-9A-Za-z.-]+)?$') {
            throw "Release tag is not a supported SemVer version: $tag"
          }

          $fileVersion = "$($Matches[1]).$($Matches[2]).$($Matches[3]).0"
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          "FILE_VERSION=$fileVersion" | Out-File -FilePath $env:GITHUB_ENV -Append
          "IS_PRERELEASE=$($version.Contains('-').ToString().ToLowerInvariant())" |
            Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Restore and audit dependencies
        run: >-
          dotnet restore .\EDActivityOverlay\EDActivityOverlay.sln
          -p:NuGetAudit=true
          -p:NuGetAuditMode=all
          -warnaserror

      - name: Restore publish runtime
        run: >-
          dotnet restore .\EDActivityOverlay\EDActivityOverlay.csproj
          --runtime win-x64
          -p:NuGetAudit=true
          -p:NuGetAuditMode=all
          -warnaserror

      - name: Build
        run: >-
          dotnet build .\EDActivityOverlay\EDActivityOverlay.sln
          --configuration Release
          --no-restore
          -warnaserror
          "-p:Version=$env:RELEASE_VERSION"
          "-p:AssemblyVersion=$env:FILE_VERSION"
          "-p:FileVersion=$env:FILE_VERSION"

      - name: Test
        run: >-
          dotnet test .\Testing\EDActivityOverlay.Tests\EDActivityOverlay.Tests.csproj
          --configuration Release
          --no-build
          --logger "trx;LogFileName=test-results.trx"
          --results-directory .\artifacts\test-results

      - name: Publish application
        run: >-
          dotnet publish .\EDActivityOverlay\EDActivityOverlay.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --no-restore
          --output .\Release
          "-p:Version=$env:RELEASE_VERSION"
          "-p:AssemblyVersion=$env:FILE_VERSION"
          "-p:FileVersion=$env:FILE_VERSION"

      - name: Validate and prepare portable package
        shell: pwsh
        run: |
          $required = @(
            '.\Release\EDActivityOverlay.exe',
            '.\Release\LICENSE',
            '.\Release\THIRD_PARTY.md',
            '.\Release\ThirdPartyLicenses\Apache-2.0.txt',
            '.\Release\Themes'
          )

          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path)) {
              throw "Published output is missing: $path"
            }
          }

          Get-ChildItem -LiteralPath '.\Release' -Filter '*.pdb' -Recurse |
            Remove-Item -Force

          New-Item -ItemType Directory -Path '.\artifacts' -Force | Out-Null
          $zip = ".\artifacts\EDActivityOverlay_$env:RELEASE_VERSION`_portable_win-x64.zip"
          Compress-Archive -Path '.\Release\*' -DestinationPath $zip -CompressionLevel Optimal

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --version=6.7.1 --yes --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path -LiteralPath $iscc)) {
            throw "Inno Setup compiler was not found: $iscc"
          }

          .\build_installer.ps1 `
            -SkipBuild `
            -Version $env:RELEASE_VERSION `
            -InnoCompiler $iscc

          $installer = ".\Installer\EDActivityOverlay_Setup_$env:RELEASE_VERSION.exe"
          if (-not (Test-Path -LiteralPath $installer)) {
            throw "Installer was not created: $installer"
          }

          Copy-Item -LiteralPath $installer -Destination '.\artifacts'

      - name: Create checksums
        shell: pwsh
        run: |
          $files = Get-ChildItem -LiteralPath '.\artifacts' -File |
            Where-Object { $_.Name -ne 'SHA256SUMS.txt' } |
            Sort-Object Name

          $lines = foreach ($file in $files) {
            $hash = Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256
            "$($hash.Hash.ToLowerInvariant())  $($file.Name)"
          }

          $lines | Set-Content -LiteralPath '.\artifacts\SHA256SUMS.txt' -Encoding utf8

      - name: Upload release bundle
        uses: actions/upload-artifact@v7
        with:
          name: EDActivityOverlay-${{ github.ref_name }}
          path: |
            artifacts/EDActivityOverlay_*.zip
            artifacts/EDActivityOverlay_Setup_*.exe
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(
            ".\artifacts\EDActivityOverlay_$env:RELEASE_VERSION`_portable_win-x64.zip",
            ".\artifacts\EDActivityOverlay_Setup_$env:RELEASE_VERSION.exe",
            '.\artifacts\SHA256SUMS.txt'
          )

          $arguments = @(
            'release', 'create', '${{ github.ref_name }}',
            '--verify-tag',
            '--title', "ED Activity Overlay $env:RELEASE_VERSION",
            '--generate-notes'
          )

          if ($env:IS_PRERELEASE -eq 'true') {
            $arguments += '--prerelease'
          }
          else {
            $arguments += '--latest'
          }

          $arguments += $assets
          gh @arguments

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-test-results-${{ github.run_id }}
          path: artifacts/test-results
          if-no-files-found: error
          retention-days: 30
