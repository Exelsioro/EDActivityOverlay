name: Build and test

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore .\EDActivityOverlay\EDActivityOverlay.sln

      - name: Build
        run: dotnet build .\EDActivityOverlay\EDActivityOverlay.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test .\Testing\EDActivityOverlay.Tests\EDActivityOverlay.Tests.csproj --configuration Release --no-build